apis:
- name: Netomi Status API
  description: >-
    Public machine-readable status feed for the Netomi platform, served by Atlassian Statuspage at status.netomi.com.
    Exposes the standard Statuspage v2 JSON surface (summary, status, components, incidents, scheduled
    maintenances) plus Atom and RSS incident-history feeds, covering the US Production, EU Production
    and SG Production component groups (Netomi Chat Interface, Netomi Integration Recipes, Agentic Studio,
    Topic Prediction, Generative AI Prediction, Telephony, and the US Cloud / US Cloud2 / EU Cloud / SG
    Cloud infrastructure components).
  humanURL: https://status.netomi.com
  baseURL: https://status.netomi.com/api/v2
  tags:
  - Status
  - Monitoring
  - Uptime
  tags_raw:
  - status
  - monitoring
  - uptime
