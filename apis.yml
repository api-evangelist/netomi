aid: netomi
name: Netomi
description: 'Netomi (founded 2016 as msg.ai) is an enterprise agentic AI platform
  for customer experience. Its "Agentic OS for CX" orchestrates a network of AI agents
  across chat, email, telephony, social, search, MCP and API channels, layering a governance
  tier (topic and policy guardrails, prompt security, response validation) over a task-planning
  orchestration agent and specialised knowledge-retrieval, action, personalisation and
  sentiment agents, with RAG/Graph-RAG retrieval, reinforcement-learning feedback and
  AI observability. Netomi ships first-party mobile Chat SDKs for iOS (Swift Package
  Manager, plus the deprecated NetomiChatSDK CocoaPod), Android (com.netomi.chat:chat-widget-android
  on Maven Central) and React Native (@netomi.com/netomi-chat-react-native on npm),
  all backed by the api.netomi.com service with optional JWT-authenticated sessions,
  guest sessions, custom API headers and a bidirectional SDK event bus. The platform
  runs in US, EU and Singapore production regions and publishes SOC 2 Type II, ISO 27001,
  PCI DSS, HIPAA, GDPR, CCPA and PDPA compliance posture. The Agentic Studio console
  and the developer documentation portal are gated behind an enterprise account, but a
  live, unlinked OpenAPI 3.1.0 contract for the AgentDesk REST API — 56 paths, 67
  operations, 103 schemas, covering the conversation engine, NLU prediction, query
  analysis, conversation history, per-bot rate-limit configuration, visitor
  authorization and sixteen inbound channel webhooks (Zendesk, Zoho, Salesforce,
  Freshdesk, Gladly, Helpshift, Sprinklr, Sunshine Conversations, Facebook, Twitter,
  Google Assistant, Firebase) — is served publicly at
  https://api.netomi.com/v3/api-docs with Swagger UI at
  https://api.netomi.com/swagger-ui.html.'
