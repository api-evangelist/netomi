apis:
- name: Netomi Platform API
  description: The Netomi backend service that fronts the Agentic OS for CX. It backs
    the first-party mobile Chat SDKs (session establishment, message exchange, rich
    media, file attachments, forms, live agent handoff, push notification registration)
    and exposes per-partner inbound webhook endpoints used by helpdesk integrations
    such as Gladly at /v1/{partner}/webhook. Sessions are either guest (anonymous,
    SDK-managed) or JWT-authenticated with a reauthorization flow. Access is provisioned
    per enterprise account with a bot reference ID and a region environment. A live
    OpenAPI 3.1.0 description (AgentDesk REST API — 56 paths, 67 operations, 103
    schemas) is served at /v3/api-docs with Swagger UI at /swagger-ui.html, though it
    is not linked from any Netomi documentation and declares no securitySchemes,
    summaries, descriptions, examples or non-200 responses.
  humanURL: https://api.netomi.com/swagger-ui.html
  baseURL: https://api.netomi.com
