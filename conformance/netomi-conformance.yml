  source: security/netomi-domain-security.yml
- id: dmarc
  conforms: true
  evidence: netomi.com publishes DMARC with policy `reject`, plus SPF.
- id: dnssec
  conforms: false
  evidence: netomi.com is not DNSSEC-signed and publishes no CAA records.
