sdk_errors:
  note: Client-side error surface of the iOS/Android Chat SDKs — SDK events and typed
    errors, not HTTP codes.
  event: {name: error, channel: getEventUpdatesFromSDK, payload_key: error_details}
  types:
  - {name: NCWErrorData, surface: 'launch(errorHandler:)', note: delivered only when
      the chat UI cannot be shown}
  - {name: NetomiEventError, surface: sendEventToSdk, note: 'thrown for a missing JWT
      on reauthorizationSuccess, a missing or reserved custom eventName, or a
      non-JSON-serializable payload'}
  documented_failures:
  - {symptom: chat will not launch / launchAsync returns false, cause: not initialized,
     invalid botRefId or env, or bot config could not be fetched}
  - {symptom: no bot messages arrive, cause: real-time connection or session not
      established}
  - {symptom: reauthorization loops, cause: missing or expired JWT on
      reauthorizationSuccess}
  - {symptom: push notifications never arrive, cause: token not handed to the SDK or
      bot not configured for push}
  source: https://github.com/msgai/netomi-chat-ios/blob/main/docs/troubleshooting.md
