  items:
  - subject: NetomiChatSDK CocoaPod (base pod and /Analytics subspec)
    status: deprecated
    ends: '2026-10-01'
    replacement: Swift Package Manager product `Netomi` from
      https://github.com/msgai/netomi-chat-ios.git
    migration_guide: https://github.com/msgai/netomi-chat-ios/blob/main/docs/installation.md#migrating-from-cocoapods-to-swift-package-manager
    note: Already-published pod versions remain installable after the cutoff; Netomi
