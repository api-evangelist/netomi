note: 'Netomi publishes NO hosted MCP server. mcp.netomi.com does not resolve,

  https://api.netomi.com/mcp returns the platform 404 envelope, and no MCP endpoint

  URL appears in any public Netomi document. The tools below are a CANDIDATE mapping

  derived from real operationIds in the live AgentDesk OpenAPI — they are a proposal,

  not something Netomi serves. No MCPServer pointer is wired in apis.yml, because

  there is no server to point at.


  Netomi does consume MCP: its architecture page lists MCP among supported interaction

  modes and model integrations, and the platform error registry carries MCP_ERROR,

  MCP_VALIDATION_ERROR and MCP_SERVER_NOT_FOUND — evidence the platform connects

  outward to MCP servers rather than exposing one.

  '
