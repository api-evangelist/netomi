openapi: 3.2.0
info:
  title: AgentDesk REST Booking Confirmation Controller API
  description: AgentDesk Rest API
  termsOfService: Terms of service
  contact:
    name: Netomi Support Team
    url: https://netomi.com
    email: support@netomi.com
  version: '1.0'
servers:
- url: http://api.netomi.com
  description: Generated server url
tags:
- name: booking-confirmation-controller
paths:
  /v1/booking:
    post:
      tags:
      - booking-confirmation-controller
      operationId: bookingConfirmation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingConfirmationRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
components:
  schemas:
    BookingConfirmationRequest:
      type: object
      properties:
        linkId:
          type: string
        confirmationId:
          type: string
        payload:
          type: object
          additionalProperties:
            type: string
